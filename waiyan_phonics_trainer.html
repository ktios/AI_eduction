<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拼读兽 · 音源与唤醒卡</title>
<style>
:root{
  --ink:#212121; --sub:#6d6d6d; --paper:#fffdf7; --line:#e3ddd0;
  --c1:#E64A19; --c2:#00897B; --c3:#1E88E5; --c4:#8E24AA; --c5:#43A047; --c6:#D81B60;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--paper);color:var(--ink);font-size:16px;line-height:1.5}
header{padding:14px 16px 10px;border-bottom:2px solid var(--line);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;margin:0}
.badge{font-size:12px;padding:2px 8px;border-radius:10px;background:#efe9dc;color:var(--sub)}
#timer{margin-left:auto;font-variant-numeric:tabular-nums;font-size:15px;
  padding:4px 10px;border-radius:10px;background:#fff;border:1px solid var(--line)}
#timer.over{background:#ffebee;color:#c62828;border-color:#ef9a9a}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{flex:0 0 auto;font-size:14px;padding:7px 13px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--sub)}
nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{padding:14px 16px 60px;max-width:820px;margin:0 auto}
.hint{font-size:13px;color:var(--sub);margin:0 0 12px}
.card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:20px 16px;text-align:center;
  box-shadow:0 2px 0 rgba(0,0,0,.05)}
.card .tag{font-size:12px;color:var(--sub)}
.card .word{font-size:40px;font-weight:700;margin:8px 0 2px;word-break:break-word}
.card .chunk{font-size:17px;color:var(--c2);letter-spacing:1px;margin-bottom:4px}
.card .zh{font-size:15px;color:var(--sub);min-height:22px}
.card .zh.hide{visibility:hidden}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
button.act{font-size:15px;padding:10px 16px;border-radius:12px;border:2px solid var(--ink);
  background:#fff;cursor:pointer;font-weight:600}
button.act.primary{background:var(--c2);border-color:var(--c2);color:#fff}
button.act.warn{background:#fff3e0;border-color:var(--c1);color:var(--c1)}
button.act.ghost{border-color:var(--line);color:var(--sub);font-weight:400;font-size:13px;padding:7px 12px}
button.act:active{transform:translateY(1px)}
.prog{height:8px;border-radius:5px;background:#efe9dc;overflow:hidden;margin:12px 0}
.prog i{display:block;height:100%;background:var(--c5)}
.unitblk{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fff}
.unitblk h3{margin:0 0 2px;font-size:15px}
.unitblk .meta{font-size:12px;color:var(--sub);margin-bottom:8px}
.wlist{display:flex;flex-wrap:wrap;gap:6px}
.wlist button{font-size:14px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);
  background:#fdfdfd;cursor:pointer}
.wlist button .t{font-size:10px;color:var(--sub);margin-left:4px}
.wlist button.done{background:#e8f5e9;border-color:#a5d6a7}
.sent{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.sent .en{font-size:16px}
.sent .zh{font-size:12px;color:var(--sub);margin-top:2px}
.sent button{margin-top:6px;font-size:13px;padding:5px 11px;border-radius:9px;
  border:1px solid var(--c3);color:var(--c3);background:#fff;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:left}
th{font-size:12px;color:var(--sub);font-weight:400}
.big{font-size:26px;font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi span{display:block;font-size:12px;color:var(--sub)}
.spd{display:flex;gap:6px;align-items:center;justify-content:center;font-size:13px;color:var(--sub);margin-top:10px}
.spd button{font-size:13px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
.spd button.on{background:var(--c3);color:#fff;border-color:var(--c3)}
.warnbox{background:#fff8e1;border:1px solid #ffe082;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
footer{font-size:12px;color:var(--sub);text-align:center;padding:16px;border-top:1px solid var(--line)}
@media (max-width:420px){.card .word{font-size:32px}}
</style>
</head>
<body>
<header>
  <h1>拼读兽 · 音源与唤醒卡</h1>
  <span class="badge" id="today"></span>
  <span class="badge" id="streak"></span>
  <span id="timer">05:00</span>
</header>
<nav>
  <button data-v="day" class="on">今日 5 张</button>
  <button data-v="words">单元词库发音</button>
  <button data-v="sent">句型跟读</button>
  <button data-v="stat">进度</button>
</nav>
<main>
  <div id="view"></div>
</main>
<footer>本页只做两件事：标准发音 + 明天该复习哪几张。主玩法在纸质卡上。数据存在本机浏览器里，不上传。</footer>

<script id="core">
/* 纯逻辑层：可在 node 中直接测试，不依赖 DOM */
var CORE = (function () {
  var INTERVALS = [1, 1, 2, 4, 7, 15, 30];   // level 0..6 对应下次间隔天数
  var MAXLV = INTERVALS.length - 1;
  var DAILY = 5;

  function dstr(d) {
    var y = d.getFullYear(), m = d.getMonth() + 1, a = d.getDate();
    return y + '-' + (m < 10 ? '0' : '') + m + '-' + (a < 10 ? '0' : '') + a;
  }
  function parse(s) {
    var p = s.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function addDays(s, n) {
    var d = parse(s);
    d.setDate(d.getDate() + n);
    return dstr(d);
  }
  function diffDays(a, b) {          // b - a，单位天
    return Math.round((parse(b) - parse(a)) / 86400000);
  }
  function initState() {
    return { cards: {}, lastDay: null, streak: 0, doneToday: [], ver: 1 };
  }
  function getCard(st, id) {
    if (!st.cards[id]) st.cards[id] = { lv: 0, due: null, seen: 0, miss: 0 };
    return st.cards[id];
  }
  function isMastered(c) { return c && c.lv >= 4; }

  // 开新的一天：结算连续天数、清空当天完成记录
  // 只有"昨天"且"昨天做满了 DAILY 张"才算接上；隔天或没做满都归零
  function rollDay(st, today) {
    if (!st.cards) st.cards = {};
    if (!st.doneToday) st.doneToday = [];
    if (typeof st.streak !== 'number') st.streak = 0;
    if (st.lastDay === today) return st;
    if (st.lastDay) {
      var gap = diffDays(st.lastDay, today);
      if (gap === 1 && st.doneToday.length >= DAILY) st.streak = st.streak + 1;
      else st.streak = 0;
    }
    st.lastDay = today;
    st.doneToday = [];
    return st;
  }

  // 一次作答：ok=true 升级，false 降两级并明天重来
  function review(st, id, ok, today) {
    var c = getCard(st, id);
    c.seen += 1;
    if (ok) {
      c.lv = Math.min(MAXLV, c.lv + 1);
    } else {
      c.miss += 1;
      c.lv = Math.max(0, c.lv - 2);
    }
    c.due = addDays(today, ok ? INTERVALS[c.lv] : 1);
    if (st.doneToday.indexOf(id) < 0) st.doneToday.push(id);
    return c;
  }

  /* 选今天的 n 张：
     1) 已到期且答错过的（lv 低优先）
     2) 其它已到期的（due 早优先）
     3) 没学过的新词，按单元顺序
     pool: [{id, unit, tier, ...}] */
  function pickToday(st, pool, today, n) {
    n = n || DAILY;
    var due = [], fresh = [];
    for (var i = 0; i < pool.length; i++) {
      var it = pool[i], c = st.cards[it.id];
      if (st.doneToday.indexOf(it.id) >= 0) continue;
      if (!c || !c.due) { fresh.push(it); continue; }
      if (diffDays(c.due, today) >= 0) due.push(it);
    }
    due.sort(function (a, b) {
      var ca = st.cards[a.id], cb = st.cards[b.id];
      if (ca.lv !== cb.lv) return ca.lv - cb.lv;
      if (ca.due !== cb.due) return ca.due < cb.due ? -1 : 1;
      return a.unit - b.unit;
    });
    var out = due.slice(0, n);
    for (var j = 0; out.length < n && j < fresh.length; j++) out.push(fresh[j]);
    return out;
  }

  // 明天的预告数量
  function forecast(st, pool, today) {
    var t = addDays(today, 1), k = 0;
    for (var i = 0; i < pool.length; i++) {
      var c = st.cards[pool[i].id];
      if (c && c.due && diffDays(c.due, t) >= 0) k++;
    }
    return Math.min(k, DAILY);
  }

  function stats(st, pool) {
    var total = pool.length, seen = 0, mastered = 0, weak = [];
    var byUnit = {};
    for (var i = 0; i < pool.length; i++) {
      var it = pool[i], c = st.cards[it.id];
      if (!byUnit[it.unit]) byUnit[it.unit] = { total: 0, mastered: 0 };
      byUnit[it.unit].total++;
      if (c && c.seen) seen++;
      if (isMastered(c)) { mastered++; byUnit[it.unit].mastered++; }
      if (c && c.miss >= 2 && !isMastered(c)) weak.push({ id: it.id, miss: c.miss });
    }
    weak.sort(function (a, b) { return b.miss - a.miss; });
    return { total: total, seen: seen, mastered: mastered, byUnit: byUnit,
             weak: weak.slice(0, 10) };
  }

  return { INTERVALS: INTERVALS, MAXLV: MAXLV, DAILY: DAILY, dstr: dstr,
           addDays: addDays, diffDays: diffDays, initState: initState,
           getCard: getCard, isMastered: isMastered, rollDay: rollDay,
           review: review, pickToday: pickToday, forecast: forecast,
           stats: stats };
})();
if (typeof module !== 'undefined') { module.exports = CORE; }
</script>

<script id="ui">
(function () {
  if (typeof document === 'undefined') return;
  var KEY = 'phonics-monsters-v1';
  var POOL = [];
  DATA.units.forEach(function (u) {
    u.words.forEach(function (w) {
      POOL.push({ id: 'u' + u.no + ':' + w.w, w: w.w, zh: w.zh, chunk: w.chunk,
                  tier: w.tier, unit: u.no, digraph: u.digraph });
    });
  });

  var st, today = CORE.dstr(new Date()), rate = 0.8, voice = null;

  function load() {
    try { st = JSON.parse(localStorage.getItem(KEY)) || CORE.initState(); }
    catch (e) { st = CORE.initState(); }
    if (!st.cards) st = CORE.initState();
    CORE.rollDay(st, today);
    save();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
  }

  /* ---------------- TTS ---------------- */
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    var vs = speechSynthesis.getVoices() || [];
    var pref = ['Samantha', 'Alex', 'Daniel', 'Karen', 'Google US English',
                'Microsoft Aria', 'Microsoft Zira'];
    for (var i = 0; i < pref.length; i++) {
      for (var j = 0; j < vs.length; j++) {
        if (vs[j].name.indexOf(pref[i]) >= 0) { voice = vs[j]; return; }
      }
    }
    for (var k = 0; k < vs.length; k++) {
      if (/^en[-_]/i.test(vs[k].lang)) { voice = vs[k]; return; }
    }
  }
  if ('speechSynthesis' in window) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }
  function say(text, r) {
    if (!('speechSynthesis' in window)) {
      alert('这个浏览器不支持朗读，请换 Safari 或 Chrome 打开本页。');
      return;
    }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = r || rate;
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  }
  // 句型朗读：空格处不念 "blank"，而是留一段真实停顿，分段排队朗读
  function sayFrame(en, r) {
    if (!('speechSynthesis' in window)) {
      alert('这个浏览器不支持朗读，请换 Safari 或 Chrome 打开本页。');
      return;
    }
    speechSynthesis.cancel();
    var parts = String(en).split(/_+/);
    parts.forEach(function (p, i) {
      var txt = p.replace(/\s+/g, ' ').replace(/^\s*[,，]\s*/, '').trim();
      if (/[A-Za-z]/.test(txt)) {
        var u = new SpeechSynthesisUtterance(txt);
        u.lang = 'en-US';
        u.rate = r || 0.75;
        if (voice) u.voice = voice;
        speechSynthesis.speak(u);
      }
      if (i < parts.length - 1) {          // 空格处排一个静音停顿，给孩子填词
        // 注意：部分浏览器会跳过纯空白文本，所以用真实音节 + volume 0 占出时长
        var g = new SpeechSynthesisUtterance('mm mm');
        g.lang = 'en-US';
        g.volume = 0;
        g.rate = 0.4;
        speechSynthesis.speak(g);
      }
    });
  }
  function spell(word) {          // 按 chunk 分块慢读，再整读
    var parts = String(word).split(/[\s\-]+/).join(' ');
    say(parts, 0.55);
    setTimeout(function () { say(word, 0.85); }, 1100);
  }

  /* ---------------- 5 分钟计时 ---------------- */
  var left = 300, tick = null, tEl = document.getElementById('timer');
  function startTimer() {
    if (tick) return;
    tick = setInterval(function () {
      left--;
      var m = Math.floor(Math.abs(left) / 60), s = Math.abs(left) % 60;
      tEl.textContent = (left < 0 ? '+' : '') + (m < 10 ? '0' : '') + m + ':' +
                        (s < 10 ? '0' : '') + s;
      if (left <= 0) tEl.className = 'over';
    }, 1000);
  }

  /* ---------------- 视图 ---------------- */
  var view = document.getElementById('view'), cur = 'day';
  var queue = [], qi = 0, showZh = false;

  // 用 template 解析，才能正确构造 <tr>/<td> 这类必须在表格上下文里的片段
  function el(html) {
    var t = document.createElement('template');
    t.innerHTML = String(html).trim();
    return t.content.firstElementChild;
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  function renderDay() {
    view.innerHTML = '';
    var doneN = st.doneToday.length;
    // 每天硬性只发 DAILY 张，做满就收工（避免又被补上新词、超过 5 分钟）
    if (doneN >= CORE.DAILY) {
      queue = []; qi = 0;
      view.appendChild(el('<p class="hint">今天的 5 张已经做完了，明天再来。想多练就去「单元词库发音」随便点。</p>'));
      view.appendChild(el('<div class="card"><div class="tag">明天要唤醒</div>' +
        '<div class="big">' + CORE.forecast(st, POOL, today) + ' 张</div></div>'));
      return;
    }
    if (!queue.length || qi >= queue.length) {
      queue = CORE.pickToday(st, POOL, today, CORE.DAILY - doneN);
      qi = 0;
    }
    if (!queue.length) {
      view.appendChild(el('<p class="hint">今天的 5 张已经做完了，明天再来。想多练就去「单元词库发音」随便点。</p>'));
      view.appendChild(el('<div class="card"><div class="tag">明天要唤醒</div>' +
        '<div class="big">' + CORE.forecast(st, POOL, today) + ' 张</div></div>'));
      return;
    }
    var it = queue[qi];
    var c = CORE.getCard(st, it.id);
    view.appendChild(el('<p class="hint">第 ' + (doneN + 1) + ' / ' + CORE.DAILY +
      ' 张 · 先点喇叭听，自己读出来，再判断会不会。</p>'));
    var card = el(
      '<div class="card">' +
      '<div class="tag">U' + it.unit + ' ' + esc(it.digraph) + ' · LEVEL ' + c.lv + '</div>' +
      '<div class="word">' + esc(it.w) + '</div>' +
      '<div class="chunk">' + esc(it.chunk) + '</div>' +
      '<div class="zh' + (showZh ? '' : ' hide') + '">' + esc(it.zh) + '</div>' +
      '<div class="row">' +
        '<button class="act primary" data-a="say">🔊 整读</button>' +
        '<button class="act" data-a="spell">🐢 分块慢读</button>' +
      '</div>' +
      '<div class="row">' +
        '<button class="act warn" data-a="no">还不会</button>' +
        '<button class="act primary" data-a="yes">读对了</button>' +
      '</div>' +
      '<div class="row"><button class="act ghost" data-a="zh">' +
        (showZh ? '收起意思' : '看意思') + '</button></div>' +
      '<div class="spd">语速' +
        '<button data-r="0.6"' + (rate === 0.6 ? ' class="on"' : '') + '>慢</button>' +
        '<button data-r="0.8"' + (rate === 0.8 ? ' class="on"' : '') + '>中</button>' +
        '<button data-r="1"' + (rate === 1 ? ' class="on"' : '') + '>正常</button>' +
      '</div></div>');
    view.appendChild(card);
    var bar = el('<div class="prog"><i style="width:' +
      Math.round(doneN / CORE.DAILY * 100) + '%"></i></div>');
    view.appendChild(bar);

    card.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.r) { rate = +b.dataset.r; renderDay(); return; }
      var a = b.dataset.a;
      if (a === 'say') { startTimer(); say(it.w); }
      else if (a === 'spell') { startTimer(); spell(it.w); }
      else if (a === 'zh') { showZh = !showZh; renderDay(); }
      else if (a === 'yes' || a === 'no') {
        startTimer();
        CORE.review(st, it.id, a === 'yes', today);
        save();
        showZh = false;
        qi++;
        if (st.doneToday.length >= CORE.DAILY) { queue = []; qi = 0; }
        renderDay();
        document.getElementById('streak').textContent = '连续 ' + st.streak + ' 天';
      }
    });
  }

  function renderWords() {
    view.innerHTML = '';
    view.appendChild(el('<p class="hint">点任意单词听标准发音；绿色 = 已经掌握（LEVEL 4 以上）。这里不计分，随便点。</p>'));
    DATA.units.forEach(function (u) {
      var blk = el('<div class="unitblk"><h3>U' + u.no + ' ' + esc(u.title) + '</h3>' +
        '<div class="meta">' + esc(u.digraph) + ' ' + esc(u.sound) + ' · ' +
        esc(u.mapName) + '</div><div class="wlist"></div></div>');
      var box = blk.querySelector('.wlist');
      u.words.forEach(function (w) {
        var id = 'u' + u.no + ':' + w.w;
        var done = CORE.isMastered(st.cards[id]);
        var b = el('<button' + (done ? ' class="done"' : '') + '>' + esc(w.w) +
          '<span class="t">' + '·'.repeat(w.tier) + '</span></button>');
        b.addEventListener('click', function () { startTimer(); say(w.w); });
        box.appendChild(b);
      });
      view.appendChild(blk);
    });
  }

  function renderSent() {
    view.innerHTML = '';
    view.appendChild(el('<p class="hint">Boss 战句型。点一下听整句：下划线处会留一段停顿（不念出来），让孩子在停顿里自己填上手里的拼读兽，再跟读一遍。</p>'));
    DATA.units.forEach(function (u) {
      var blk = el('<div class="unitblk"><h3>U' + u.no + ' ' + esc(u.digraph) +
        ' · ' + esc(u.bossName) + '</h3><div class="meta">' + esc(u.bossRule) +
        '</div></div>');
      u.sentences.forEach(function (s) {
        var row = el('<div class="sent"><div class="en">' + esc(s.en) + '</div>' +
          '<div class="zh">' + esc(s.zh) + '</div>' +
          '<button>🔊 听整句</button></div>');
        row.querySelector('button').addEventListener('click', function () {
          startTimer();
          sayFrame(s.en, 0.75);
        });
        blk.appendChild(row);
      });
      view.appendChild(blk);
    });
  }

  function renderStat() {
    view.innerHTML = '';
    var s = CORE.stats(st, POOL);
    view.appendChild(el('<div class="grid3">' +
      '<div class="kpi"><b class="big">' + s.mastered + '</b><span>已掌握</span></div>' +
      '<div class="kpi"><b class="big">' + s.seen + '</b><span>练过</span></div>' +
      '<div class="kpi"><b class="big">' + s.total + '</b><span>词表总数</span></div>' +
      '</div>'));
    view.appendChild(el('<div class="prog"><i style="width:' +
      Math.round(s.mastered / s.total * 100) + '%"></i></div>'));
    var tb = el('<table><thead><tr><th>单元</th><th>掌握 / 总数</th><th>进度</th></tr></thead><tbody></tbody></table>');
    var body = tb.querySelector('tbody');
    DATA.units.forEach(function (u) {
      var b = s.byUnit[u.no] || { total: 0, mastered: 0 };
      body.appendChild(el('<tr><td>U' + u.no + ' ' + esc(u.digraph) + '</td><td>' +
        b.mastered + ' / ' + b.total + '</td><td>' +
        (b.total ? Math.round(b.mastered / b.total * 100) : 0) + '%</td></tr>'));
    });
    view.appendChild(tb);
    if (s.weak.length) {
      var w = el('<div class="warnbox"><b>反复错的词（建议家长在纸卡上单独挑出来）：</b><br>' +
        s.weak.map(function (x) { return esc(x.id.split(':')[1]) + '（错 ' + x.miss + ' 次）'; })
        .join('、') + '</div>');
      view.appendChild(w);
    }
    view.appendChild(el('<p class="hint">明天要唤醒 ' + CORE.forecast(st, POOL, today) +
      ' 张。间隔天数：答对后依次 1 / 1 / 2 / 4 / 7 / 15 / 30 天，答错退两级、明天重来。</p>'));
    var rst = el('<button class="act ghost">清空本机记录</button>');
    rst.addEventListener('click', function () {
      if (confirm('清空后所有掌握进度都会没有，确定？')) {
        st = CORE.initState(); CORE.rollDay(st, today); save(); renderStat();
      }
    });
    view.appendChild(rst);
  }

  function render() {
    if (cur === 'day') renderDay();
    else if (cur === 'words') renderWords();
    else if (cur === 'sent') renderSent();
    else renderStat();
  }

  document.querySelector('nav').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    cur = b.dataset.v;
    Array.prototype.forEach.call(document.querySelectorAll('nav button'),
      function (x) { x.className = x === b ? 'on' : ''; });
    render();
  });

  load();
  document.getElementById('today').textContent = today;
  document.getElementById('streak').textContent = '连续 ' + st.streak + ' 天';
  render();
})();
</script>
</body>
</html>
